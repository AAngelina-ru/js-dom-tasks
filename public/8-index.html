<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Генератор алертов</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
  </head>
  <body>
    <div class="container m-3">
      <button id="alert-generator" class="btn btn-primary">Generate Alert</button>
      <div class="alerts m-5"></div>
    </div>

    <!-- Необходимые JS-зависимости Bootstrap (jQuery, Popper, Bootstrap JS) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>

    <script>
      // Счётчик для нумерации алертов (опционально)
      let alertCounter = 1;

      // Функция создания нового алерта
      function createAlert(message) {
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-success alert-dismissible fade show';
        alertDiv.setAttribute('role', 'alert');
        
        // Текст сообщения
        const textNode = document.createTextNode(message);
        alertDiv.appendChild(textNode);
        
        // Кнопка закрытия (крестик)
        const closeButton = document.createElement('button');
        closeButton.type = 'button';
        closeButton.className = 'close';
        closeButton.setAttribute('data-dismiss', 'alert');
        closeButton.setAttribute('aria-label', 'Close');
        
        const closeSpan = document.createElement('span');
        closeSpan.setAttribute('aria-hidden', 'true');
        closeSpan.innerHTML = '&times;';
        closeButton.appendChild(closeSpan);
        
        alertDiv.appendChild(closeButton);
        return alertDiv;
      }

      // Обработчик кнопки
      document.getElementById('alert-generator').addEventListener('click', function() {
        const message = `Alert #${alertCounter++}: Это сгенерированный алерт!`;
        const newAlert = createAlert(message);
        const alertsContainer = document.querySelector('.alerts');
        alertsContainer.appendChild(newAlert);
      });
    </script>
  </body>
</html>
